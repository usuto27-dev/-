name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/body-fat-management-app-gy0vrf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Bust cache on local CSS/JS
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s#\(css/style\.css\|js/storage\.js\|js/calc\.js\|js/fooddb\.js\|js/app\.js\)\"#\1?v=${v}\"#g" index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
